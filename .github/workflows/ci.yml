name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit, service and API tests
        run: pytest -q
      - name: Regression gate (offline stand-in model)
        run: cx-gate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cx-copilot:ci .
      - name: Boot it and check health
        run: |
          docker run -d --name cx -p 8000:8000 -e CX_ENV=dev cx-copilot:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/tickets -H 'content-type: application/json' \
               -d '{"text":"I was charged twice"}'
          docker logs cx
