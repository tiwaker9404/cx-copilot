[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cx-copilot"
version = "0.1.0"
description = "Customer-support triage and reply agent (LangGraph) with LangSmith tracing, quality evals and a regression gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0",
  "langsmith>=0.4",
]

[project.optional-dependencies]
live = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8"]

[project.scripts]
cx-copilot = "cx_copilot.cli:main"
cx-gate = "cx_copilot.gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cx_copilot = ["prompts/*.md", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
