[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cx-copilot"
version = "0.2.0"
description = "Customer-support triage and reply agent (LangGraph) with LangSmith tracing, quality evals and a regression gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0",
  "langsmith>=0.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "openai>=1.50",
]

[project.optional-dependencies]
live = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cx-copilot = "cx_copilot.cli:main"
cx-gate = "cx_copilot.gate:main"
cx-compare = "cx_copilot.compare:main"
cx-serve = "cx_copilot.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cx_copilot = ["prompts/*.md", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
